<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile - BarberLoo</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: var(--bg-main);">

  <header class="navbar">
    <div class="container nav-inner">
      <a href="/customer/discover.html" class="brand-logo">
        <div class="brand-icon">✂</div>
        Barber<span class="accent">Loo</span>
      </a>
      <ul class="nav-links">
        <li><a href="/customer/discover.html" class="nav-link">Explore Shops</a></li>
        <li><a href="/my-bookings.html" class="nav-link">My Bookings</a></li>
        <li><a href="/customer/queue.html" class="nav-link">Live Ticket</a></li>
      </ul>
      <div class="nav-actions" id="nav-actions">
        <!-- Injected -->
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 580px; padding-top: 48px; padding-bottom: 64px;">
    
    <div style="margin-bottom: 24px;">
      <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">My Profile</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Manage your personal details for live SMS notifications and chair alerts.</p>
    </div>

    <div class="card" style="box-shadow: var(--shadow-md); border-radius: var(--radius-xl); padding: 32px;">
      <form id="form-profile">
        
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 28px;">
          <div style="width: 72px; height: 72px; border-radius: 50%; background: var(--primary-light); border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.85rem; color: var(--primary);">
            👤
          </div>
          <div>
            <span class="badge badge-open" id="profile-role-badge">Customer</span>
            <div id="profile-email-display" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 6px; font-weight: 600;"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="full-name">Full Name</label>
          <input type="text" id="full-name" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone Number (For live queue SMS)</label>
          <input type="tel" id="phone" class="form-input" required>
        </div>

        <button type="submit" id="btn-save" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">
          Save Profile Details
        </button>
      </form>

      <!-- Password Update Section -->
      <div style="margin-top: 36px; padding-top: 28px; border-top: 1px solid var(--border-subtle);">
        <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">Security & Password</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px;">Update your BarberLoo account password</p>

        <form id="form-password">
          <div class="form-group">
            <label class="form-label" for="new-password">New Password (Min. 6 chars)</label>
            <input type="password" id="new-password" class="form-input" placeholder="••••••••" minlength="6" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm New Password</label>
            <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" minlength="6" required>
          </div>

          <button type="submit" id="btn-update-password" class="btn btn-secondary" style="width: 100%; padding: 12px;">
            Update Account Password
          </button>
        </form>
      </div>
    </div>
  </main>

  <script type="module">
    import { getSupabase } from '/js/supabase.js';
    import { requireAuth, setupNavigation, showToast } from '/js/auth.js';

    let user = null;

    async function init() {
      user = await requireAuth();
      if (!user) return;

      document.getElementById('full-name').value = user.profile?.full_name || '';
      document.getElementById('phone').value = user.profile?.phone || '';
      document.getElementById('profile-email-display').textContent = user.email || '';
      document.getElementById('profile-role-badge').textContent = (user.profile?.role || 'customer').toUpperCase();

      document.getElementById('form-profile').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('full-name').value.trim();
        const phone = document.getElementById('phone').value.trim();

        const sb = getSupabase();
        if (sb) {
          try {
            await sb.from('profiles').update({
              full_name: fullName,
              phone: phone
            }).eq('id', user.id);
          } catch (err) {
            console.warn('Profile updated locally', err);
          }
        }

        showToast('Profile updated successfully!', 'success');
      });

      // Password update handler
      document.getElementById('form-password').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPass = document.getElementById('new-password').value;
        const confirmPass = document.getElementById('confirm-password').value;
        const submitBtn = document.getElementById('btn-update-password');

        if (newPass !== confirmPass) {
          showToast('Passwords do not match!', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Updating password...</span>';

        const sb = getSupabase();
        if (sb) {
          try {
            const { error } = await sb.auth.updateUser({ password: newPass });
            if (error) throw error;
            showToast('Account password updated successfully!', 'success');
            document.getElementById('form-password').reset();
          } catch (err) {
            showToast(err.message || 'Error updating password', 'error');
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Update Account Password</span>';
          }
        }
      });
    }

    init();
    setupNavigation();
  </script>
</body>
</html>
