<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Services - BarberLoo PRO</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: var(--bg-main);">

  <header class="navbar">
    <div class="container nav-inner">
      <div style="display: flex; align-items: center; gap: 24px;">
        <a href="/barber/dashboard.html" class="brand-logo">
          <div class="brand-icon">✂</div>
          Barber<span class="accent">Loo</span>
          <span style="font-size: 0.75rem; background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: var(--radius-sm); margin-left: 8px; font-weight: 700;">PRO</span>
        </a>
        <ul class="nav-links">
          <li><a href="/barber/dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="/barber/analytics.html" class="nav-link">Analytics</a></li>
          <li><a href="/barber/queue.html" class="nav-link">Live Queue Desk</a></li>
          <li><a href="/barber/appointments.html" class="nav-link">Appointments</a></li>
          <li><a href="/barber/shop.html" class="nav-link">Manage Shop</a></li>
          <li><a href="/barber/services.html" class="nav-link active">Services</a></li>
        </ul>
      </div>

      <div class="nav-actions">
        <button id="btn-add-service" class="btn btn-primary btn-sm">+ Add New Treatment</button>
        <button id="btn-logout" class="btn btn-outline btn-sm">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 900px; padding-top: 40px; padding-bottom: 64px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main);">Treatments & Pricing Menu</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Configure the treatments and cuts customers can queue for and book online.</p>
      </div>
    </div>

    <!-- Services List -->
    <div id="services-grid" style="display: flex; flex-direction: column; gap: 16px;">
      <!-- Populated via script -->
    </div>
  </main>

  <script type="module">
    import { getSupabase } from '/js/supabase.js';
    import { requireAuth, signOut, showToast } from '/js/auth.js';

    let services = [];
    let user = null;
    let shopId = null;

    async function loadServices() {
      const sb = getSupabase();
      if (sb) {
        try {
          const { data: shop } = await sb.from('shops').select('id').eq('owner_id', user.id).single();
          if (shop) {
            shopId = shop.id;
            const { data: dbServices } = await sb.from('services').select('*').eq('shop_id', shop.id);
            if (dbServices && dbServices.length > 0) {
              services = dbServices;
              renderServices();
              return;
            }
          }
        } catch (e) {
          console.warn('Real services check completed:', e);
        }
      }

      services = [
        { id: 'srv-demo-1', name: 'Signature Precision Haircut (Sandbox Test)', description: 'Consultation, precision scissor & clipper cut, neck shave finish.', price: 45.00, duration: 30, is_active: true }
      ];
      renderServices();
    }

    function renderServices() {
      const container = document.getElementById('services-grid');
      container.innerHTML = services.map(srv => `
        <div class="card" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 24px; border-radius: var(--radius-xl); background: #ffffff;">
          <div style="flex: 1;">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
              <h3 style="font-size: 1.2rem; font-weight: 800; color: var(--text-main);">${srv.name}</h3>
              <span class="badge ${srv.is_active ? 'badge-open' : 'badge-closed'}">${srv.is_active ? 'Active' : 'Inactive'}</span>
              <span class="badge" style="background: var(--bg-subtle); color: var(--text-muted);">${srv.duration} mins</span>
            </div>
            <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 6px;">${srv.description}</p>
            <div style="font-size: 1.3rem; font-weight: 800; color: var(--primary);">$${Number(srv.price).toFixed(2)}</div>
          </div>

          <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline btn-sm" onclick="window.toggleService('${srv.id}')">
              ${srv.is_active ? 'Deactivate' : 'Activate'}
            </button>
            <button class="btn btn-secondary btn-sm" onclick="window.editService('${srv.id}')">
              Edit Price
            </button>
          </div>
        </div>
      `).join('');
    }

    window.toggleService = async function(id) {
      const srv = services.find(s => s.id === id);
      if (srv) {
        srv.is_active = !srv.is_active;
        const sb = getSupabase();
        if (sb && !id.startsWith('srv-demo')) {
          await sb.from('services').update({ is_active: srv.is_active }).eq('id', id);
        }
        showToast(`Treatment "${srv.name}" ${srv.is_active ? 'activated' : 'deactivated'}`, 'info');
        renderServices();
      }
    };

    window.editService = async function(id) {
      const srv = services.find(s => s.id === id);
      if (!srv) return;
      const newPrice = prompt(`Update price for ${srv.name}:`, srv.price);
      if (newPrice !== null && !isNaN(Number(newPrice))) {
        srv.price = Number(newPrice);
        const sb = getSupabase();
        if (sb && !id.startsWith('srv-demo')) {
          await sb.from('services').update({ price: srv.price }).eq('id', id);
        }
        showToast('Price updated', 'success');
        renderServices();
      }
    };

    document.getElementById('btn-add-service').addEventListener('click', async () => {
      const name = prompt('Enter treatment name:');
      if (!name) return;
      const price = prompt('Enter treatment price ($):', '35.00');
      const duration = prompt('Enter duration in minutes:', '30');

      const sb = getSupabase();
      if (sb && shopId) {
        try {
          const { data, error } = await sb.from('services').insert({
            shop_id: shopId,
            name: name,
            description: 'Professional barber treatment',
            price: Number(price) || 35,
            duration: Number(duration) || 30,
            is_active: true
          }).select().single();

          if (!error && data) {
            services.push(data);
            showToast(`Added treatment: ${name}`, 'success');
            renderServices();
            return;
          }
        } catch (err) {
          console.warn('Real service insert check:', err);
        }
      }

      services.push({
        id: 'srv-' + Date.now(),
        name,
        description: 'Professional barber treatment',
        price: Number(price) || 35,
        duration: Number(duration) || 30,
        is_active: true
      });

      showToast(`Added treatment: ${name}`, 'success');
      renderServices();
    });

    document.getElementById('btn-logout').addEventListener('click', () => signOut());

    async function init() {
      user = await requireAuth(['barber', 'admin']);
      if (!user) return;
      loadServices();
    }

    init();
  </script>
</body>
</html>
