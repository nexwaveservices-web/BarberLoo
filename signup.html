<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - BarberLoo</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: var(--bg-main);">

  <header class="navbar">
    <div class="container nav-inner">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">✂</div>
        Barber<span class="accent">Loo</span>
      </a>
      <div class="nav-actions">
        <span style="color: var(--text-muted); font-size: 0.9rem;">Already registered?</span>
        <a href="/login.html" class="btn btn-outline btn-sm">Log In</a>
      </div>
    </div>
  </header>

  <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 16px;">
    <div class="card" style="width: 100%; max-width: 480px; box-shadow: var(--shadow-md); border-radius: var(--radius-xl); padding: 36px 32px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 1.85rem; font-weight: 800; margin-bottom: 6px; color: var(--text-main);">Create an Account</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Join BarberLoo for real-time queues and appointment scheduling</p>
      </div>

      <!-- Role Selector Tabs -->
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; background: var(--bg-subtle); padding: 6px; border-radius: var(--radius-full); margin-bottom: 24px;">
        <button type="button" id="tab-customer" class="btn btn-primary btn-sm" style="width: 100%; border-radius: var(--radius-full);">
          Customer
        </button>
        <button type="button" id="tab-barber" class="btn btn-secondary btn-sm" style="width: 100%; border: none; border-radius: var(--radius-full); background: transparent;">
          Barber
        </button>
        <button type="button" id="tab-admin" class="btn btn-secondary btn-sm" style="width: 100%; border: none; border-radius: var(--radius-full); background: transparent;">
          Admin
        </button>
      </div>

      <div id="admin-notice" style="display: none; padding: 12px; border-radius: var(--radius-sm); background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; font-size: 0.85rem; margin-bottom: 20px;">
        🛡 <strong>Platform Admin Registration:</strong> Sets up administrative governance access. Authorized administrator email will be granted immediate access.
      </div>

      <div id="signup-error" style="display: none; padding: 12px; border-radius: var(--radius-sm); background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; font-size: 0.875rem; margin-bottom: 20px;"></div>

      <form id="form-signup">
        <input type="hidden" id="role" value="customer">

        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-input" placeholder="Marcus Sterling" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone Number (For queue SMS)</label>
          <input type="tel" id="phone" class="form-input" placeholder="+1 (555) 019-2834" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="marcus@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (Minimum 6 characters)</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" minlength="6" required autocomplete="new-password">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px;">
          <button type="submit" id="btn-submit" class="btn btn-primary" style="padding: 12px; font-weight: 700;">
            <span id="btn-label">Sign Up</span>
          </button>
          <a href="/login.html" class="btn btn-secondary" style="padding: 12px; font-weight: 700; text-align: center; text-decoration: none;">
            Sign In
          </a>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import { signUp, redirectByRole } from '/js/auth.js';

    const urlParams = new URLSearchParams(window.location.search);
    const initialRole = urlParams.get('role') === 'barber' ? 'barber' : 'customer';

    const tabCustomer = document.getElementById('tab-customer');
    const tabBarber = document.getElementById('tab-barber');
    const tabAdmin = document.getElementById('tab-admin');
    const adminNotice = document.getElementById('admin-notice');
    const roleInput = document.getElementById('role');
    const btnLabel = document.getElementById('btn-label');
    const errorBox = document.getElementById('signup-error');
    const form = document.getElementById('form-signup');
    const submitBtn = document.getElementById('btn-submit');

    function resetTab(tab) {
      tab.className = 'btn btn-secondary btn-sm';
      tab.style.background = 'transparent';
      tab.style.color = 'var(--text-main)';
      tab.style.border = 'none';
      tab.style.borderRadius = 'var(--radius-full)';
    }

    function activateTab(tab) {
      tab.className = 'btn btn-primary btn-sm';
      tab.style.background = 'var(--primary)';
      tab.style.color = '#ffffff';
      tab.style.border = 'none';
      tab.style.borderRadius = 'var(--radius-full)';
    }

    function setRole(role) {
      roleInput.value = role;
      resetTab(tabCustomer);
      resetTab(tabBarber);
      resetTab(tabAdmin);
      adminNotice.style.display = 'none';

      if (role === 'barber') {
        activateTab(tabBarber);
        btnLabel.textContent = 'Create Barber Partner Account';
      } else if (role === 'admin') {
        activateTab(tabAdmin);
        adminNotice.style.display = 'block';
        btnLabel.textContent = 'Create Admin Account';
        if (!document.getElementById('email').value) {
          document.getElementById('email').value = 'rgi855477@gmail.com';
        }
        if (!document.getElementById('fullName').value) {
          document.getElementById('fullName').value = 'Platform Administrator';
        }
      } else {
        activateTab(tabCustomer);
        btnLabel.textContent = 'Create Customer Account';
      }
    }

    setRole(initialRole);

    tabCustomer.addEventListener('click', () => setRole('customer'));
    tabBarber.addEventListener('click', () => setRole('barber'));
    tabAdmin.addEventListener('click', () => setRole('admin'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const role = roleInput.value;

      submitBtn.disabled = true;
      btnLabel.textContent = 'Creating account...';

      try {
        await signUp(email, password, fullName, phone, role);
        redirectByRole(role);
      } catch (err) {
        errorBox.textContent = err.message || 'Error creating account. Please try again.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        btnLabel.textContent = role === 'barber' ? 'Create Barber Partner Account' : 'Create Customer Account';
      }
    });
  </script>
</body>
</html>
