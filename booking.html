<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment - BarberLoo</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: var(--bg-main);">

  <header class="navbar">
    <div class="container nav-inner">
      <a href="/customer/discover.html" class="brand-logo">
        <div class="brand-icon">✂</div>
        Barber<span class="accent">Loo</span>
      </a>
      <ul class="nav-links">
        <li><a href="/customer/discover.html" class="nav-link">← Cancel & Back</a></li>
      </ul>
      <div class="nav-actions" id="nav-actions">
        <!-- Auth injected -->
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 620px; padding-top: 48px; padding-bottom: 64px;">
    
    <div style="margin-bottom: 24px;">
      <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">Reserve Appointment</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Select your preferred date and time slot for a guaranteed barber chair.</p>
    </div>

    <!-- Booking Summary Card -->
    <div class="card" style="margin-bottom: 24px; background: #ffffff; border-radius: var(--radius-xl); border-left: 4px solid var(--primary); padding: 22px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700;">Selected Service</span>
          <h3 id="summary-service-name" style="font-size: 1.25rem; font-weight: 800; color: var(--text-main); margin-top: 2px;">Signature Precision Haircut</h3>
          <p id="summary-shop-name" style="font-size: 0.9rem; color: var(--text-muted); margin-top: 2px;">BarberLoo Heritage Lounge</p>
        </div>
        <div style="text-align: right;">
          <div id="summary-price" style="font-size: 1.5rem; font-weight: 800; color: var(--primary);">$45.00</div>
          <div id="summary-duration" style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">30 mins</div>
        </div>
      </div>
    </div>

    <!-- Form Wizard Card -->
    <div class="card" style="box-shadow: var(--shadow-md); border-radius: var(--radius-xl); padding: 32px;">
      <form id="form-booking">
        
        <!-- Step 1: Select Date -->
        <div class="form-group">
          <label class="form-label" for="booking-date">1. Choose Date</label>
          <input type="date" id="booking-date" class="form-input" required>
        </div>

        <!-- Step 2: Time Slots Grid -->
        <div class="form-group" style="margin-top: 24px;">
          <label class="form-label">2. Select Available Slot</label>
          <div id="slots-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; margin-top: 8px;">
            <!-- Generated dynamically -->
          </div>
          <input type="hidden" id="selected-slot" required>
        </div>

        <!-- Step 3: Special Notes -->
        <div class="form-group" style="margin-top: 24px;">
          <label class="form-label" for="notes">3. Haircut Instructions or Notes (Optional)</label>
          <textarea id="notes" class="form-textarea" rows="2" placeholder="e.g. Skin fade with textured top, scissor trim, sensitive skin"></textarea>
        </div>

        <button type="submit" id="btn-submit-booking" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 28px;" disabled>
          <span>Confirm & Reserve Appointment</span>
        </button>
      </form>
    </div>
  </main>

  <script type="module">
    import { apiClient } from '/js/api.js';
    import { getSupabase } from '/js/supabase.js';
    import { requireAuth, setupNavigation, showToast } from '/js/auth.js';

    let user = null;
    const urlParams = new URLSearchParams(window.location.search);
    const shopId = urlParams.get('shop_id') || '00000000-0000-0000-0000-000000000001';
    const serviceId = urlParams.get('service_id') || 'srv-1';

    // Set minimum date to today
    const dateInput = document.getElementById('booking-date');
    const today = new Date().toISOString().split('T')[0];
    dateInput.min = today;
    dateInput.value = today;

    const availableSlots = [
      '09:00 AM', '09:45 AM', '10:30 AM', '11:15 AM',
      '01:00 PM', '01:45 PM', '02:30 PM', '03:15 PM',
      '04:00 PM', '04:45 PM', '05:30 PM', '06:15 PM'
    ];

    function renderSlots() {
      const slotsContainer = document.getElementById('slots-grid');
      const hiddenInput = document.getElementById('selected-slot');
      const submitBtn = document.getElementById('btn-submit-booking');

      slotsContainer.innerHTML = availableSlots.map(slot => `
        <button type="button" class="btn btn-secondary btn-sm slot-btn" data-slot="${slot}" style="padding: 10px 4px; font-size: 0.85rem; border-radius: var(--radius-md);">
          ${slot}
        </button>
      `).join('');

      const buttons = slotsContainer.querySelectorAll('.slot-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => {
            b.className = 'btn btn-secondary btn-sm slot-btn';
            b.style.background = 'var(--bg-subtle)';
            b.style.color = 'var(--text-main)';
          });
          btn.className = 'btn btn-primary btn-sm slot-btn';
          btn.style.background = 'var(--primary)';
          btn.style.color = '#ffffff';
          hiddenInput.value = btn.dataset.slot;
          submitBtn.disabled = false;
        });
      });
    }

    async function init() {
      user = await requireAuth();
      if (!user) return;

      renderSlots();

      // Fetch dynamic service & shop names
      const sb = getSupabase();
      if (sb) {
        try {
          const { data: srv } = await sb.from('services').select('name, price, duration').eq('id', serviceId).single();
          if (srv) {
            document.getElementById('summary-service-name').textContent = srv.name;
            document.getElementById('summary-price').textContent = `$${Number(srv.price).toFixed(2)}`;
            document.getElementById('summary-duration').textContent = `${srv.duration} mins`;
          }
          const { data: shop } = await sb.from('shops').select('name').eq('id', shopId).single();
          if (shop) {
            document.getElementById('summary-shop-name').textContent = shop.name;
          }
        } catch (e) {
          console.warn('Real booking labels fetch completed:', e);
        }
      }

      document.getElementById('form-booking').addEventListener('submit', async (e) => {
        e.preventDefault();
        const date = dateInput.value;
        const slot = document.getElementById('selected-slot').value;
        const notes = document.getElementById('notes').value.trim();
        const submitBtn = document.getElementById('btn-submit-booking');

        if (!slot) {
          showToast('Please select a time slot', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Reserving slot...</span>';

        try {
          await apiClient.bookAppointment({
            shop_id: shopId,
            service_id: serviceId,
            customer_id: user.id,
            customer_name: user.profile?.full_name || 'Client',
            customer_phone: user.profile?.phone || '',
            date,
            time_slot: slot,
            notes
          });
        } catch (err) {
          console.warn('Backend booking sync error:', err);
        }

        showToast('Appointment successfully reserved!', 'success');
        setTimeout(() => {
          window.location.href = '/my-bookings.html';
        }, 1200);
      });
    }

    init();
    setupNavigation();
  </script>
</body>
</html>
