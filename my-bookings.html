<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - BarberLoo</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: var(--bg-main);">

  <header class="navbar">
    <div class="container nav-inner">
      <a href="/customer/discover.html" class="brand-logo">
        <div class="brand-icon">✂</div>
        Barber<span class="accent">Loo</span>
      </a>
      <ul class="nav-links">
        <li><a href="/customer/discover.html" class="nav-link">Explore Shops</a></li>
        <li><a href="/my-bookings.html" class="nav-link active">My Bookings</a></li>
        <li><a href="/customer/queue.html" class="nav-link">Live Ticket</a></li>
      </ul>
      <div class="nav-actions" id="nav-actions">
        <!-- Injected -->
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 840px; padding-top: 48px; padding-bottom: 64px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main);">My Appointments</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Review your upcoming haircut reservations and booking history.</p>
      </div>
      <a href="/customer/discover.html" class="btn btn-primary btn-sm">+ Book New</a>
    </div>

    <!-- Booking Cards Container -->
    <div id="bookings-list" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="card skeleton" style="height: 120px; border-radius: var(--radius-xl);"></div>
      <div class="card skeleton" style="height: 120px; border-radius: var(--radius-xl);"></div>
    </div>
  </main>

  <script type="module">
    import { apiClient } from '/js/api.js';
    import { requireAuth, setupNavigation, showToast } from '/js/auth.js';

    let user = null;

    async function loadBookings() {
      user = await requireAuth();
      if (!user) return;

      const listContainer = document.getElementById('bookings-list');
      let bookings = [];

      try {
        const backendBookings = await apiClient.getMyAppointments(user.id);
        if (Array.isArray(backendBookings) && backendBookings.length > 0) {
          bookings = backendBookings.map(b => ({
            id: b.id,
            status: b.status,
            booking_date: b.date,
            booking_time: b.time_slot,
            notes: b.notes,
            shops: { name: b.shop_name },
            services: { name: b.service_name, price: b.price, duration: 30 }
          }));
        }
      } catch (err) {
        console.warn('Backend appointments query check:', err);
      }

      if (bookings.length === 0) {
        listContainer.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📅</div>
            <div class="empty-state-title">No Appointments Booked Yet</div>
            <p class="empty-state-desc">You don't have any upcoming or past appointments scheduled. Browse barbers and reserve a guaranteed chair slot in advance.</p>
            <a href="/customer/discover.html" class="btn btn-primary">Find a Barber & Book Slot</a>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = bookings.map(b => {
        const isUpcoming = b.status === 'confirmed' || b.status === 'pending';
        const badgeColor = b.status === 'confirmed' ? 'badge-open' : b.status === 'completed' ? 'badge-serving' : 'badge-closed';

        return `
          <div class="card" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 24px; border-radius: var(--radius-xl); background: #ffffff;">
            <div style="flex: 1;">
              <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
                <span class="badge ${badgeColor}">${b.status.toUpperCase()}</span>
                <span style="font-weight: 800; color: var(--text-main); font-size: 1.15rem;">${b.services?.name || 'Haircut'}</span>
              </div>

              <div style="font-size: 0.95rem; color: var(--text-main); font-weight: 600; margin-bottom: 6px;">
                🏢 ${b.shops?.name || 'Barbershop'}
              </div>

              <div style="font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 18px; flex-wrap: wrap;">
                <span>📅 ${b.booking_date} at ${b.booking_time}</span>
                <span>⏱ ${b.services?.duration || 30} mins</span>
                <span style="color: var(--primary); font-weight: 800;">$${Number(b.services?.price || 40).toFixed(2)}</span>
              </div>

              ${b.notes ? `<div style="margin-top: 8px; font-size: 0.825rem; color: var(--text-dim);">Notes: "${b.notes}"</div>` : ''}
            </div>

            <div>
              ${isUpcoming ? `
                <button class="btn btn-outline btn-sm" onclick="window.cancelBooking('${b.id}')" style="color: #ef4444; border-color: #fca5a5;">
                  Cancel
                </button>
              ` : `
                <a href="/customer/discover.html" class="btn btn-secondary btn-sm">Book Again</a>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    window.cancelBooking = async function(bookingId) {
      if (!confirm('Are you sure you want to cancel this booking?')) return;
      const sb = getSupabase();
      if (sb) {
        await sb.from('bookings').update({ status: 'cancelled' }).eq('id', bookingId);
      }
      showToast('Booking cancelled', 'info');
      loadBookings();
    };

    loadBookings();
    setupNavigation();
  </script>
</body>
</html>
