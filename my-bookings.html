<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - BarberLoo</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="/customer/discover.html" class="brand-logo">
        <div class="brand-icon">✂</div>
        Barber<span class="accent">Loo</span>
      </a>
      <ul class="nav-links">
        <li><a href="/customer/discover.html" class="nav-link">Explore Shops</a></li>
        <li><a href="/my-bookings.html" class="nav-link active">My Bookings</a></li>
        <li><a href="/customer/queue.html" class="nav-link">Live Ticket</a></li>
      </ul>
      <div class="nav-actions" id="nav-actions">
        <!-- Injected -->
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 840px; padding-top: 40px; padding-bottom: 64px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px;">
      <div>
        <h1 style="font-size: 1.85rem; font-weight: 800;">My Appointments</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Manage your upcoming sessions and view past haircut history.</p>
      </div>
      <a href="/customer/discover.html" class="btn btn-primary btn-sm">+ Book New</a>
    </div>

    <!-- Booking Cards Container -->
    <div id="bookings-list" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="card skeleton" style="height: 120px;"></div>
      <div class="card skeleton" style="height: 120px;"></div>
    </div>
  </main>

  <script type="module">
    import { getSupabase } from '/js/supabase.js';
    import { requireAuth, setupNavigation, showToast } from '/js/auth.js';

    let user = null;

    async function loadBookings() {
      user = await requireAuth();
      if (!user) return;

      const listContainer = document.getElementById('bookings-list');
      const sb = getSupabase();

      let bookings = [];

      if (sb) {
        try {
          const { data, error } = await sb
            .from('bookings')
            .select(`
              *,
              shops(name, address, city, phone),
              services(name, price, duration)
            `)
            .eq('customer_id', user.id)
            .order('booking_date', { ascending: true });

          if (data && data.length > 0) bookings = data;
        } catch (err) {
          console.warn('Fallback bookings used', err);
        }
      }

      // Demo bookings if none exist yet
      if (bookings.length === 0) {
        bookings = [
          {
            id: 'bkg-demo-1',
            booking_date: 'Tomorrow',
            booking_time: '02:30 PM',
            status: 'confirmed',
            notes: 'High taper fade, scissor trim on top',
            shops: { name: 'The Golden Razor Lounge', address: '442 Market Street, Downtown', city: 'San Francisco' },
            services: { name: 'Signature Precision Haircut', price: 45.00, duration: 30 }
          },
          {
            id: 'bkg-demo-2',
            booking_date: 'Sep 18, 2026',
            booking_time: '11:00 AM',
            status: 'completed',
            notes: '',
            shops: { name: 'Crown & Blade Studio', address: '880 Valencia Street', city: 'San Francisco' },
            services: { name: 'Skin Fade & Razor Finish', price: 50.00, duration: 35 }
          }
        ];
      }

      listContainer.innerHTML = bookings.map(b => {
        const isUpcoming = b.status === 'confirmed' || b.status === 'pending';
        const badgeColor = b.status === 'confirmed' ? 'badge-open' : b.status === 'completed' ? 'badge-serving' : 'badge-closed';

        return `
          <div class="card" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px;">
            <div style="flex: 1;">
              <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
                <span class="badge ${badgeColor}">${b.status.toUpperCase()}</span>
                <span style="font-weight: 700; color: var(--text-main); font-size: 1.1rem;">${b.services?.name || 'Haircut'}</span>
              </div>

              <div style="font-size: 0.95rem; color: var(--text-main); font-weight: 600; margin-bottom: 4px;">
                🏢 ${b.shops?.name || 'Barbershop'}
              </div>

              <div style="font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 16px; flex-wrap: wrap;">
                <span>📅 ${b.booking_date} at ${b.booking_time}</span>
                <span>⏱ ${b.services?.duration || 30} mins</span>
                <span style="color: var(--primary); font-weight: 700;">$${Number(b.services?.price || 40).toFixed(2)}</span>
              </div>

              ${b.notes ? `<div style="margin-top: 8px; font-size: 0.825rem; color: var(--text-dim);">Notes: "${b.notes}"</div>` : ''}
            </div>

            <div>
              ${isUpcoming ? `
                <button class="btn btn-outline btn-sm" onclick="window.cancelBooking('${b.id}')" style="color: #ef4444; border-color: rgba(239,68,68,0.3);">
                  Cancel
                </button>
              ` : `
                <a href="/customer/discover.html" class="btn btn-secondary btn-sm">Book Again</a>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    window.cancelBooking = async function(bookingId) {
      if (!confirm('Are you sure you want to cancel this booking?')) return;
      const sb = getSupabase();
      if (sb) {
        await sb.from('bookings').update({ status: 'cancelled' }).eq('id', bookingId);
      }
      showToast('Booking cancelled', 'info');
      loadBookings();
    };

    loadBookings();
    setupNavigation();
  </script>
</body>
</html>
